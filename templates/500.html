<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Esta página não carregou — Desenvolvimento Back-end | UNIPÊ</title>
  <style>
    :root {
      --background: oklch(0.985 0.005 250);
      --foreground: oklch(0.24 0.055 258);
      --muted-foreground: oklch(0.52 0.03 256);
      --primary: oklch(0.32 0.09 258);
      --primary-foreground: oklch(0.985 0.005 250);
      --border: oklch(0.915 0.012 250);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--background);
      color: var(--foreground);
      font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      padding: 0 1rem;
    }
    .wrap { max-width: 28rem; text-align: center; }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.015em; font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; }
    p { margin: 0.5rem 0 0; font-size: 0.875rem; color: var(--muted-foreground); }
    .actions { margin-top: 1.5rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.375rem;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .btn-primary { background-color: var(--primary); color: var(--primary-foreground); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-outline { background-color: transparent; color: var(--foreground); border-color: var(--border); }
    .btn-outline:hover { background-color: var(--border); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Esta página não carregou</h1>
    <p>Ocorreu um erro inesperado no servidor. Tente novamente ou volte ao início.</p>
    <div class="actions">
      <button type="button" class="btn btn-primary" onclick="window.location.reload()">Tentar novamente</button>
      <a class="btn btn-outline" href="/">Início</a>
    </div>
  </div>
</body>
</html>
