<div class="card-soft h-full p-5 transition-shadow hover:shadow-[var(--shadow-lift)]">
  {% if index %}<p class="eyebrow">{{ index }}</p>{% endif %}
  <h3 class="mt-1 text-lg font-semibold text-foreground">{{ title }}</h3>
  <div class="mt-2 text-sm leading-relaxed text-muted-foreground">
    {% if icon %}
    <span class="flex items-start gap-2">
      <i data-lucide="{{ icon }}" class="mt-0.5 size-4 shrink-0 text-primary"></i>
      <span>{{ body }}</span>
    </span>
    {% else %}
    {{ body }}
    {% endif %}
  </div>
</div>
