{% load static %}
<nav class="sidebar-nav flex h-full flex-col gap-1 overflow-y-auto p-4">
  <a href="{% url 'presentation:apresentacao' %}" class="mb-6 flex items-center gap-3 px-1">
    <img
      src="{% static 'img/unipe-logo-light.png' %}"
      alt="Logo do Centro Universitário de João Pessoa (UNIPÊ)"
      class="h-9 w-auto max-w-[7rem] object-contain"
    />
    <span class="text-sm leading-tight font-semibold text-sidebar-foreground">
      BACK-END
      <span class="block text-xs font-normal text-sidebar-caption">2026.2</span>
    </span>
  </a>

  {% for item in nav_items %}
  <a
    href="{{ item.url }}"
    class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm transition-colors {% if item.active %}bg-sidebar-accent font-semibold text-sidebar-primary{% else %}text-sidebar-foreground-muted hover:bg-sidebar-accent-hover hover:text-sidebar-foreground{% endif %}"
    {% if item.active %}aria-current="page"{% endif %}
  >
    <i data-lucide="{{ item.icon }}" class="size-4 shrink-0 {% if item.active %}text-sidebar-primary{% endif %}"></i>
    <span class="min-w-0 flex-1 truncate">{{ item.label }}</span>
  </a>
  {% endfor %}

  <div class="mt-auto pt-4">
    <div class="mb-3 h-px bg-sidebar-border"></div>
    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button
        type="submit"
        class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-sidebar-foreground-muted transition-colors hover:bg-sidebar-accent-hover hover:text-sidebar-foreground cursor-pointer"
      >
        <i data-lucide="log-out" class="size-4 shrink-0"></i>
        Logout
      </button>
    </form>
  </div>
</nav>
