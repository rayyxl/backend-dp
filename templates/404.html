<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página não encontrada — Desenvolvimento Back-end | UNIPÊ</title>
  <style>
    :root {
      --background: oklch(0.985 0.005 250);
      --foreground: oklch(0.24 0.055 258);
      --muted-foreground: oklch(0.52 0.03 256);
      --primary: oklch(0.32 0.09 258);
      --primary-foreground: oklch(0.985 0.005 250);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--background);
      color: var(--foreground);
      font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      padding: 0 1rem;
    }
    .wrap { max-width: 28rem; text-align: center; }
    h1 { font-size: 4.5rem; font-weight: 700; margin: 0; font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; }
    h2 { margin: 1rem 0 0; font-size: 1.25rem; font-weight: 600; font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; }
    p { margin: 0.5rem 0 0; font-size: 0.875rem; color: var(--muted-foreground); }
    a.btn {
      margin-top: 1.5rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.375rem;
      background-color: var(--primary);
      color: var(--primary-foreground);
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
    }
    a.btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <h2>Página não encontrada</h2>
    <p>A página que você procura não existe ou foi movida.</p>
    <div>
      <a class="btn" href="/">Voltar ao início</a>
    </div>
  </div>
</body>
</html>
