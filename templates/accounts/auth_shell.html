{% extends "base.html" %}
{% load static %}
{% block body %}
<main class="bg-grid flex min-h-screen items-center justify-center bg-background px-4 py-10">
  <div class="section-enter w-full max-w-md">
    <div class="card-soft px-7 py-8">
      <img
        src="{% static 'img/unipe-logo.png' %}"
        alt="Logo do Centro Universitário de João Pessoa (UNIPÊ)"
        class="h-12 w-auto"
      />
      <p class="eyebrow mt-6">Design Profissional · 2026.2</p>
      <h1 class="mt-1 text-2xl font-semibold text-foreground">{% block auth_title %}{% endblock %}</h1>
      <p class="mt-2 text-sm text-muted-foreground">{% block auth_subtitle %}{% endblock %}</p>
      <div class="mt-6">{% block auth_content %}{% endblock %}</div>
    </div>
    {% block auth_footer %}{% endblock %}
  </div>
</main>
{% endblock %}
